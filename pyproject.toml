[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-learning-lab"
version = "0.1.0"
description = "Hands-on local PySpark curriculum and ETL lab"
requires-python = ">=3.9"
dependencies = ["pyspark==3.5.5", "jupyterlab>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
