[metadata]
name = pyspark-learning-lab
version = 0.1.0
description = Hands-on local PySpark curriculum and ETL lab

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pyspark==3.5.5
    jupyterlab>=4.0,<5

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.4,<9
